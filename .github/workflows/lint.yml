name: Lint

# golangci-lint covers the analysis floor: bug-finders + a security audit
# (gosec). Linter set + exclusions live in .golangci.yml — tweak there.
#
# Runs on PRs targeting main/beta — catches issues before they land.

on:
  pull_request:
    branches:
      - main
      - beta

permissions:
  contents: read

jobs:
  golangci-lint:
    name: golangci-lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e  # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a  # v9.3.0
        with:
          version: v2.12.2
          args: --timeout=5m

  # SA-08: the audit found symbol-level paths to eight Go standard-library
  # advisories because the toolchain is pinned by the `go` directive in go.mod
  # and that directive had gone stale. Nothing was watching it, so this runs
  # govulncheck over BOTH build tags — the internal build compiles files the
  # public one does not.
  govulncheck:
    name: govulncheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e  # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@latest

      - name: public build
        run: govulncheck ./...

      - name: internal build
        run: govulncheck -tags internal ./...
