name: Lint

# golangci-lint covers the analysis floor: bug-finders + a security audit
# (gosec). Linter set + exclusions live in .golangci.yml — tweak there.
#
# Runs on PRs targeting main/beta — catches issues before they land.

on:
  pull_request:
    branches:
      - main
      - beta

permissions:
  contents: read

jobs:
  golangci-lint:
    name: golangci-lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4.3.1

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff  # v5.6.0
        with:
          go-version-file: go.mod
          cache: true

      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a  # v9.3.0
        with:
          version: v2.12.2
          args: --timeout=5m
