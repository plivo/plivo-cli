name: Lint

# golangci-lint covers the analysis floor: bug-finders + a security audit
# (gosec). Linter set + exclusions live in .golangci.yml — tweak there.
#
# Runs on PRs targeting main/beta — catches issues before they land.

on:
  pull_request:
    branches:
      - main
      - beta

permissions:
  contents: read

jobs:
  golangci-lint:
    name: golangci-lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff  # v5.6.0
        with:
          go-version-file: go.mod
          cache: true

      - uses: golangci/golangci-lint-action@82606bf257cbaff209d206a39f5134f0cfbfd2ee  # v9.2.1
        with:
          version: v2.12.2
          args: --timeout=5m
