name: CodeQL

# Static security analysis via GitHub's CodeQL.
#
# Runs on:
#   - PRs targeting main (gates merges)
#   - weekly schedule (catches new CodeQL rules against unchanged code)
#
# Findings surface in Security → Code scanning. The default Go query
# pack is enough for a CLI; we don't load the extended pack to keep
# the run time predictable.

on:
  pull_request:
    branches: [main]
  schedule:
    # Weekly Sunday 03:17 UTC — off-hours, jittered minute to avoid the
    # top-of-the-hour stampede on GitHub's scheduling queue.
    - cron: "17 3 * * 0"

permissions:
  contents: read
  security-events: write
  actions: read

jobs:
  analyze:
    name: analyze (go)
    runs-on: ubuntu-latest-m-plivo
    strategy:
      fail-fast: false
      matrix:
        language: [go]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e  # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Initialize CodeQL
        uses: github/codeql-action/init@1c5b675653bb5c22dbe9b12b556ec555138e09fd  # v4.38.1
        with:
          languages: ${{ matrix.language }}

      - name: Autobuild
        uses: github/codeql-action/autobuild@1c5b675653bb5c22dbe9b12b556ec555138e09fd  # v4.38.1

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@1c5b675653bb5c22dbe9b12b556ec555138e09fd  # v4.38.1
        with:
          category: "/language:${{ matrix.language }}"
