name: CI

on:
  push:
    # main has no Go code yet (governance-only until v1.0 cut), so we only
    # gate beta and feat/* on push. PRs targeting either are still checked.
    branches:
      - beta
      - 'feat/**'
  pull_request:
    branches:
      - beta
      - main

permissions:
  contents: read

jobs:
  smoke:
    name: smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: gofmt
        run: |
          fmt=$(gofmt -l .)
          if [ -n "$fmt" ]; then
            echo "✗ unformatted files (run 'gofmt -w .' locally):"
            echo "$fmt"
            exit 1
          fi
          echo "✓ all files formatted"

      - name: go vet
        run: go vet ./...

      - name: go mod tidy drift
        run: |
          go mod tidy
          if ! git diff --quiet go.mod go.sum; then
            echo "✗ go.mod / go.sum out of date (run 'go mod tidy' locally):"
            git diff go.mod go.sum
            exit 1
          fi
          echo "✓ go.mod tidy"

      - name: go test (race + coverage) — public build
        run: |
          go test -race -coverprofile=coverage.out -covermode=atomic ./...
          echo
          go tool cover -func=coverage.out | tail -20
          echo
          total=$(go tool cover -func=coverage.out | awk '/^total:/ {sub(/%/,""); print $3}')
          echo "Total coverage: ${total}%"

      - name: go build + test — internal build (-tags internal)
        run: |
          # The agent / contacto / auth-token surface is gated behind the
          # `internal` build tag. Build + test it here so it doesn't rot, even
          # though it doesn't ship in the public v1 binary.
          go build -tags internal -o /dev/null .
          go test -tags internal -race ./...

      - name: upload coverage artefact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-${{ github.run_id }}
          path: coverage.out
          retention-days: 14

      - name: build
        run: go build -o plivo .

      - name: smoke - version + help
        run: |
          ./plivo --version
          ./plivo --help > /dev/null

      - name: smoke - per-group --help (no HTTP)
        run: |
          # Every top-level command group must successfully render --help.
          # Catches cobra-registration regressions, missing flag definitions, etc.
          groups=(
            account agent application auth brand call campaign cnam compliance
            conference contacto endpoint link lookup masking message mpc number
            powerpack recording stream subaccount tollfree verify
          )
          for cmd in "${groups[@]}"; do
            echo "==> plivo $cmd --help"
            ./plivo "$cmd" --help > /dev/null
          done

      - name: smoke - dry-run URL construction
        env:
          # Deliberately not a real-shaped Plivo auth_id (no "MA" prefix) so
          # secret-scanners don't flag this file. The CLI doesn't validate the
          # auth_id shape pre-flight — it just embeds it in the URL — so any
          # non-empty value lets dry-run prints proceed.
          PLIVO_AUTH_ID: CIFAKEPLACEHOLDER001
          PLIVO_AUTH_TOKEN: ci-only-not-a-real-token
        run: |
          # Verify each representative command builds the expected REST URL.
          # --dry-run never sends the HTTP request; it just prints what would
          # have been sent. Catches URL-construction regressions across the
          # 26 top-level groups without needing a real Plivo account.
          set -e

          assert_url() {
            local label="$1" expected_pattern="$2"
            shift 2
            local out
            out=$("$@" 2>&1)
            if ! echo "$out" | grep -Eq "$expected_pattern"; then
              echo "✗ $label — expected pattern '$expected_pattern' in output:"
              echo "$out"
              exit 1
            fi
            echo "✓ $label"
          }

          assert_url "account get" \
            "GET https://api.plivo.com/v1/Account/[A-Z0-9]+/" \
            ./plivo account get --dry-run

          assert_url "subaccount list" \
            "GET https://api.plivo.com/v1/Account/[A-Z0-9]+/Subaccount/" \
            ./plivo subaccount list --dry-run --limit 5

          assert_url "number list" \
            "GET https://api.plivo.com/v1/Account/[A-Z0-9]+/Number/" \
            ./plivo number list --dry-run --limit 5

          assert_url "application list" \
            "GET https://api.plivo.com/v1/Account/[A-Z0-9]+/Application/" \
            ./plivo application list --dry-run

          assert_url "message send" \
            "POST https://api.plivo.com/v1/Account/[A-Z0-9]+/Message/" \
            ./plivo message send --src +14155551234 --dst +14155556789 --text hi --dry-run

          assert_url "call list" \
            "GET https://api.plivo.com/v1/Account/[A-Z0-9]+/Call/" \
            ./plivo call list --dry-run

          assert_url "recording list" \
            "GET https://api.plivo.com/v1/Account/[A-Z0-9]+/Recording/" \
            ./plivo recording list --dry-run --limit 3

          assert_url "conference list" \
            "GET https://api.plivo.com/v1/Account/[A-Z0-9]+/Conference/" \
            ./plivo conference list --dry-run

          assert_url "mpc list" \
            "GET https://api.plivo.com/v1/Account/[A-Z0-9]+/MultiPartyCall/" \
            ./plivo mpc list --dry-run --limit 3

          assert_url "verify session list" \
            "GET https://api.plivo.com/v1/Account/[A-Z0-9]+/Verify/Session/" \
            ./plivo verify session list --dry-run --limit 3

          assert_url "lookup (separate base host)" \
            "GET https://lookup.plivo.com/v1/Number/\+14155552671\?type=carrier" \
            ./plivo lookup +14155552671 --dry-run

          assert_url "brand list (10DLC path)" \
            "GET https://api.plivo.com/v1/Account/[A-Z0-9]+/10dlc/Brand/" \
            ./plivo brand list --dry-run --limit 3

          assert_url "masking session list (Masking/Session segments)" \
            "GET https://api.plivo.com/v1/Account/[A-Z0-9]+/Masking/Session/" \
            ./plivo masking session list --dry-run --limit 3

          assert_url "powerpack list" \
            "GET https://api.plivo.com/v1/Account/[A-Z0-9]+/Powerpack/" \
            ./plivo powerpack list --dry-run --limit 3

          assert_url "endpoint list" \
            "GET https://api.plivo.com/v1/Account/[A-Z0-9]+/Endpoint/" \
            ./plivo endpoint list --dry-run --limit 3

      - name: smoke - destructive verbs refuse without --yes
        env:
          # Deliberately not a real-shaped Plivo auth_id (no "MA" prefix) so
          # secret-scanners don't flag this file. The CLI doesn't validate the
          # auth_id shape pre-flight — it just embeds it in the URL — so any
          # non-empty value lets dry-run prints proceed.
          PLIVO_AUTH_ID: CIFAKEPLACEHOLDER001
          PLIVO_AUTH_TOKEN: ci-only-not-a-real-token
        run: |
          # Spend/destructive verbs must exit 5 with DESTRUCTIVE_REFUSED when
          # --yes is missing. This is the safety contract — guard it in CI.
          assert_refused() {
            local label="$1"
            shift
            if "$@" --dry-run 2>&1 | grep -q "DESTRUCTIVE_REFUSED"; then
              echo "✓ $label refused without --yes"
            else
              echo "✗ $label did not refuse"
              exit 1
            fi
          }

          assert_refused "number release"   ./plivo number release +14155551234
          assert_refused "call hangup"      ./plivo call hangup CALL-FAKE
          assert_refused "recording delete" ./plivo recording delete REC-FAKE

  cross-build:
    name: cross-build (${{ matrix.os }}/${{ matrix.arch }})
    runs-on: ubuntu-latest
    needs: smoke
    if: github.event_name == 'push' && github.ref == 'refs/heads/beta'
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: linux,  arch: amd64 }
          - { os: linux,  arch: arm64 }
          - { os: darwin, arch: amd64 }
          - { os: darwin, arch: arm64 }
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: cross-compile
        env:
          GOOS: ${{ matrix.os }}
          GOARCH: ${{ matrix.arch }}
          CGO_ENABLED: "0"
        run: |
          mkdir -p dist
          go build -ldflags="-s -w" -o "dist/plivo_${{ matrix.os }}_${{ matrix.arch }}" .

      - name: artefact size
        run: ls -lh dist/
