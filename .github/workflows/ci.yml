name: CI

on:
  pull_request:
    branches:
      - beta
      - main

permissions:
  contents: read

jobs:
  smoke:
    name: smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4.3.1

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff  # v5.6.0
        with:
          go-version-file: go.mod
          cache: true

      - name: gofmt
        run: |
          fmt=$(gofmt -l .)
          if [ -n "$fmt" ]; then
            echo "✗ unformatted files (run 'gofmt -w .' locally):"
            echo "$fmt"
            exit 1
          fi
          echo "✓ all files formatted"

      - name: go vet
        run: go vet ./...

      - name: go mod tidy drift
        run: |
          go mod tidy
          if ! git diff --quiet go.mod go.sum; then
            echo "✗ go.mod / go.sum out of date (run 'go mod tidy' locally):"
            git diff go.mod go.sum
            exit 1
          fi
          echo "✓ go.mod tidy"

      - name: docs/COMMANDS.md drift
        run: |
          # Regenerate the command reference. If anything changed, the
          # contributor forgot to run `make docs` after touching help
          # text — fail so they can rerun and amend.
          make docs
          if ! git diff --exit-code docs/COMMANDS.md; then
            echo "✗ docs/COMMANDS.md is out of date — run 'make docs' locally and commit the result"
            exit 1
          fi
          echo "✓ docs/COMMANDS.md fresh"

      - name: go test (race + coverage) — public build
        run: |
          go test -race -coverprofile=coverage.out -covermode=atomic ./...
          echo
          go tool cover -func=coverage.out | tail -20
          echo
          total=$(go tool cover -func=coverage.out | awk '/^total:/ {sub(/%/,""); print $3}')
          echo "Total coverage: ${total}%"

      - name: upload coverage artefact
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: coverage-${{ github.run_id }}
          path: coverage.out
          retention-days: 14

      - name: build
        run: go build -o plivo .

      - name: smoke - exercise the built binary
        run: ./scripts/smoke.sh ./plivo

      # The tap ships a generated formula; a template break would take out
      # `brew install` for everyone, so pin the rendering.
      - name: tap render
        run: ./scripts/gen-tap-test.sh

      # A forgotten tap bump is invisible otherwise: brew keeps serving the old
      # version and nothing complains.
      - name: tap freshness
        run: ./scripts/check-tap-fresh.sh

  # Build and run the binary natively on every platform we ship.
  smoke-os:
    name: smoke-os (${{ matrix.runner }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: ubuntu-latest,  bin: ./plivo }
          - { runner: macos-latest,   bin: ./plivo }
          - { runner: windows-latest, bin: ./plivo.exe }
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4.3.1

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff  # v5.6.0
        with:
          go-version-file: go.mod
          cache: true

      - name: build (native)
        shell: bash
        run: go build -o "${{ matrix.bin }}" .

      # Git Bash ships on windows-latest, so one script covers all runners.
      - name: smoke - exercise the built binary
        shell: bash
        run: ./scripts/smoke.sh "${{ matrix.bin }}"

  # Install the latest published release on a clean machine. Asserts install
  # mechanics (download, checksum, PATH, idempotency), not the command tree.
  install-test:
    name: install-test (${{ matrix.runner }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4.3.1

      - name: install via install.sh (posix)
        if: matrix.runner != 'windows-latest'
        env:
          PLIVO_INSTALL_DIR: ${{ runner.temp }}/plivo-bin
        run: |
          set -euo pipefail
          ./install.sh
          BIN="$PLIVO_INSTALL_DIR/plivo"
          test -x "$BIN" || { echo "✗ $BIN missing or not executable"; exit 1; }
          "$BIN" --version
          "$BIN" --help > /dev/null
          echo "✓ installed and runs"

          # Must be idempotent.
          ./install.sh
          "$BIN" --version > /dev/null
          echo "✓ idempotent on re-run"

      - name: install via install.ps1 (windows)
        if: matrix.runner == 'windows-latest'
        shell: pwsh
        env:
          PLIVO_INSTALL_DIR: ${{ runner.temp }}\plivo-bin
        run: |
          $ErrorActionPreference = 'Stop'
          .\install.ps1
          $bin = Join-Path $env:PLIVO_INSTALL_DIR 'plivo.exe'
          if (-not (Test-Path $bin)) { throw "✗ $bin missing" }
          & $bin --version
          & $bin --help | Out-Null
          Write-Host "✓ installed and runs"

          # Must be idempotent.
          .\install.ps1
          & $bin --version | Out-Null
          Write-Host "✓ idempotent on re-run"

      - name: reject a tampered download
        if: matrix.runner != 'windows-latest'
        env:
          PLIVO_INSTALL_DIR: ${{ runner.temp }}/plivo-tamper
        run: |
          set -uo pipefail
          # An unresolvable release must fail, never install.
          if PLIVO_CLI_VERSION=v0.0.0-does-not-exist ./install.sh > out.log 2>&1; then
            echo "✗ installer succeeded against a non-existent release"
            cat out.log
            exit 1
          fi
          test ! -e "$PLIVO_INSTALL_DIR/plivo" || { echo "✗ binary left behind after a failed install"; exit 1; }
          echo "✓ refused a missing/unverifiable release"

  cross-build:
    name: cross-build (${{ matrix.os }}/${{ matrix.arch }})
    runs-on: ubuntu-latest
    needs: smoke
    # Previous `if:` gated on a push event, which this workflow never receives,
    # so the job never ran. Covers the targets smoke-os cannot run natively.
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: linux,   arch: amd64, ext: "" }
          - { os: linux,   arch: arm64, ext: "" }
          - { os: darwin,  arch: amd64, ext: "" }
          - { os: darwin,  arch: arm64, ext: "" }
          - { os: windows, arch: amd64, ext: ".exe" }
          - { os: windows, arch: arm64, ext: ".exe" }
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4.3.1

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff  # v5.6.0
        with:
          go-version-file: go.mod
          cache: true

      - name: cross-compile
        env:
          GOOS: ${{ matrix.os }}
          GOARCH: ${{ matrix.arch }}
          CGO_ENABLED: "0"
        run: |
          mkdir -p dist
          go build -ldflags="-s -w" -o "dist/plivo_${{ matrix.os }}_${{ matrix.arch }}${{ matrix.ext }}" .

      - name: artefact size
        run: ls -lh dist/
