name: CI

on:
  push:
    # main has no Go code yet (governance-only until v1.0 cut), so we only
    # gate beta and feat/* on push. PRs targeting either are still checked.
    branches:
      - beta
      - 'feat/**'
  pull_request:
    branches:
      - beta
      - main

permissions:
  contents: read

jobs:
  smoke:
    name: smoke
    runs-on: ubuntu-latest-m-plivo
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4.3.1

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff  # v5.6.0
        with:
          go-version-file: go.mod
          cache: true

      - name: gofmt
        run: |
          fmt=$(gofmt -l .)
          if [ -n "$fmt" ]; then
            echo "✗ unformatted files (run 'gofmt -w .' locally):"
            echo "$fmt"
            exit 1
          fi
          echo "✓ all files formatted"

      - name: go vet
        run: go vet ./...

      - name: go mod tidy drift
        run: |
          go mod tidy
          if ! git diff --quiet go.mod go.sum; then
            echo "✗ go.mod / go.sum out of date (run 'go mod tidy' locally):"
            git diff go.mod go.sum
            exit 1
          fi
          echo "✓ go.mod tidy"

      - name: go test (race + coverage) — public build
        run: |
          go test -race -coverprofile=coverage.out -covermode=atomic ./...
          echo
          go tool cover -func=coverage.out | tail -20
          echo
          total=$(go tool cover -func=coverage.out | awk '/^total:/ {sub(/%/,""); print $3}')
          echo "Total coverage: ${total}%"

      - name: upload coverage artefact
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: coverage-${{ github.run_id }}
          path: coverage.out
          retention-days: 14

      - name: build
        run: go build -o plivo .

      - name: smoke - version + help
        run: |
          ./plivo --version
          ./plivo --help > /dev/null

      - name: smoke - per-group --help (no HTTP)
        run: |
          # Every public-build command group must render --help. Catches
          # cobra-registration regressions, missing flag definitions, etc.
          # `agent` ships as a coming-soon stub.
          groups=(
            "account" "agent" "ask" "auth" "lookup" "messaging" "numbers" "support" "upgrade" "verify" "voice"
            "account subaccounts" "account applications"
            "numbers masking" "numbers masking sessions"
            "numbers compliance" "numbers compliance requirements"
            "voice calls" "voice calls streams" "voice conferences"
            "voice multiparty" "voice recordings" "voice endpoints"
            "messaging" "messaging sms" "messaging sms 10dlc" "messaging sms 10dlc brands"
            "messaging sms powerpacks" "messaging sms tollfree" "messaging whatsapp" "messaging mms"
            "verify sessions"
          )
          for cmd in "${groups[@]}"; do
            echo "==> plivo $cmd --help"
            read -ra parts <<< "$cmd"
            ./plivo "${parts[@]}" --help > /dev/null
          done

      - name: smoke - dry-run URL construction
        env:
          # Deliberately not a real-shaped Plivo auth_id (no "MA" prefix) so
          # secret-scanners don't flag this file. The CLI doesn't validate the
          # auth_id shape pre-flight — it just embeds it in the URL — so any
          # non-empty value lets dry-run prints proceed.
          PLIVO_AUTH_ID: CIFAKEPLACEHOLDER001
          PLIVO_AUTH_TOKEN: ci-only-not-a-real-token
        run: |
          # Verify each representative command builds the expected REST URL.
          # --dry-run never sends the HTTP request; it just prints what would
          # have been sent. Catches URL-construction regressions across the
          # service grammar without needing a real Plivo account.
          set -e

          assert_url() {
            local label="$1" expected_pattern="$2"
            shift 2
            local out
            out=$("$@" 2>&1)
            if ! echo "$out" | grep -Eq "$expected_pattern"; then
              echo "✗ $label — expected pattern '$expected_pattern' in output:"
              echo "$out"
              exit 1
            fi
            echo "✓ $label"
          }

          assert_url "account get" \
            "GET https://hodor.plivo.com/v1/cli/api/v1/Account/[A-Z0-9]+/" \
            ./plivo account get --dry-run

          assert_url "account subaccounts list" \
            "GET https://hodor.plivo.com/v1/cli/api/v1/Account/[A-Z0-9]+/Subaccount/" \
            ./plivo account subaccounts list --dry-run --limit 5

          assert_url "numbers list" \
            "GET https://hodor.plivo.com/v1/cli/api/v1/Account/[A-Z0-9]+/Number/" \
            ./plivo numbers list --dry-run --limit 5

          assert_url "account applications list" \
            "GET https://hodor.plivo.com/v1/cli/api/v1/Account/[A-Z0-9]+/Application/" \
            ./plivo account applications list --dry-run

          assert_url "message send" \
            "POST https://hodor.plivo.com/v1/cli/api/v1/Account/[A-Z0-9]+/Message/" \
            ./plivo messaging sms send --src +14155551234 --dst +14155556789 --text hi --dry-run

          assert_url "voice calls list" \
            "GET https://hodor.plivo.com/v1/cli/api/v1/Account/[A-Z0-9]+/Call/" \
            ./plivo voice calls list --dry-run

          assert_url "voice recordings list" \
            "GET https://hodor.plivo.com/v1/cli/api/v1/Account/[A-Z0-9]+/Recording/" \
            ./plivo voice recordings list --dry-run --limit 3

          assert_url "voice conferences list" \
            "GET https://hodor.plivo.com/v1/cli/api/v1/Account/[A-Z0-9]+/Conference/" \
            ./plivo voice conferences list --dry-run

          assert_url "voice multiparty list" \
            "GET https://hodor.plivo.com/v1/cli/api/v1/Account/[A-Z0-9]+/MultiPartyCall/" \
            ./plivo voice multiparty list --dry-run --limit 3

          assert_url "verify sessions list" \
            "GET https://hodor.plivo.com/v1/cli/api/v1/Account/[A-Z0-9]+/Verify/Session/" \
            ./plivo verify sessions list --dry-run --limit 3

          assert_url "lookup (separate base host)" \
            "GET https://hodor.plivo.com/v1/cli/api/v1/Lookup/Number/\+14155552671\?type=carrier" \
            ./plivo lookup +14155552671 --dry-run

          assert_url "message 10dlc brands list (10DLC path)" \
            "GET https://hodor.plivo.com/v1/cli/api/v1/Account/[A-Z0-9]+/10dlc/Brand/" \
            ./plivo messaging sms 10dlc brands list --dry-run --limit 3

          assert_url "numbers masking sessions list (Masking/Session segments)" \
            "GET https://hodor.plivo.com/v1/cli/api/v1/Account/[A-Z0-9]+/Masking/Session/" \
            ./plivo numbers masking sessions list --dry-run --limit 3

          assert_url "message powerpacks list" \
            "GET https://hodor.plivo.com/v1/cli/api/v1/Account/[A-Z0-9]+/Powerpack/" \
            ./plivo messaging sms powerpacks list --dry-run --limit 3

          assert_url "voice endpoints list" \
            "GET https://hodor.plivo.com/v1/cli/api/v1/Account/[A-Z0-9]+/Endpoint/" \
            ./plivo voice endpoints list --dry-run --limit 3

          assert_url "numbers compliance requirements" \
            "GET https://hodor.plivo.com/v1/cli/api/v1/Account/[A-Z0-9]+/PhoneNumber/Compliance/Requirements/" \
            ./plivo numbers compliance requirements --country US --number-type local --user-type business --dry-run

          assert_url "numbers compliance list" \
            "GET https://hodor.plivo.com/v1/cli/api/v1/Account/[A-Z0-9]+/PhoneNumber/Compliance/" \
            ./plivo numbers compliance list --dry-run

          assert_url "numbers compliance create (multipart upload)" \
            "POST https://hodor.plivo.com/v1/cli/api/v1/Account/[A-Z0-9]+/PhoneNumber/Compliance/" \
            ./plivo numbers compliance create --data '{"country_iso":"US"}' --dry-run

          assert_url "ask (SSE)" \
            "POST https://hodor\.plivo\.com/v1/cli/cx/v1/aiassist/buddy-ext/chat" \
            ./plivo ask "ping" --dry-run

          assert_url "support (past escalations)" \
            "GET https://hodor\.plivo\.com/v1/cli/cx/v1/aiassist/buddy-ext/escalations" \
            ./plivo support --dry-run

      - name: smoke - destructive verbs refuse without --yes
        env:
          # Deliberately not a real-shaped Plivo auth_id (no "MA" prefix) so
          # secret-scanners don't flag this file. The CLI doesn't validate the
          # auth_id shape pre-flight — it just embeds it in the URL — so any
          # non-empty value lets dry-run prints proceed.
          PLIVO_AUTH_ID: CIFAKEPLACEHOLDER001
          PLIVO_AUTH_TOKEN: ci-only-not-a-real-token
        run: |
          # Spend/destructive verbs must exit 5 with DESTRUCTIVE_REFUSED when
          # --yes is missing. This is the safety contract — guard it in CI.
          assert_refused() {
            local label="$1"
            shift
            if "$@" --dry-run 2>&1 | grep -q "DESTRUCTIVE_REFUSED"; then
              echo "✓ $label refused without --yes"
            else
              echo "✗ $label did not refuse"
              exit 1
            fi
          }

          assert_refused "numbers release"         ./plivo numbers release +14155551234
          assert_refused "voice calls hangup"      ./plivo voice calls hangup CALL-FAKE
          assert_refused "voice recordings delete" ./plivo voice recordings delete REC-FAKE

  cross-build:
    name: cross-build (${{ matrix.os }}/${{ matrix.arch }})
    runs-on: ubuntu-latest-m-plivo
    needs: smoke
    if: github.event_name == 'push' && github.ref == 'refs/heads/beta'
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: linux,   arch: amd64, ext: "" }
          - { os: linux,   arch: arm64, ext: "" }
          - { os: darwin,  arch: amd64, ext: "" }
          - { os: darwin,  arch: arm64, ext: "" }
          - { os: windows, arch: amd64, ext: ".exe" }
          - { os: windows, arch: arm64, ext: ".exe" }
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4.3.1

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff  # v5.6.0
        with:
          go-version-file: go.mod
          cache: true

      - name: cross-compile
        env:
          GOOS: ${{ matrix.os }}
          GOARCH: ${{ matrix.arch }}
          CGO_ENABLED: "0"
        run: |
          mkdir -p dist
          go build -ldflags="-s -w" -o "dist/plivo_${{ matrix.os }}_${{ matrix.arch }}${{ matrix.ext }}" .

      - name: artefact size
        run: ls -lh dist/
