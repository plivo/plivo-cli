<style>
  body { background: hsl(var(--background)); color: hsl(var(--foreground)); }

  /* ── Nav (parity with index.html, scoped here in case tokens.css drifts) ── */
  .nav { position: sticky; top: 0; z-index: 50; background: hsl(var(--background) / .85); backdrop-filter: blur(10px); border-bottom: 1px solid hsl(var(--border)); }
  .nav-inner { display: flex; align-items: center; justify-content: space-between; height: 64px; }
  .nav .brand { display: inline-flex; align-items: center; gap: 10px; font-family: var(--font-sora); font-size: 18px; text-decoration: none; color: hsl(var(--foreground)); }
  .nav .brand .glyph { width: 28px; height: 28px; border-radius: 7px; background: hsl(var(--foreground)); color: hsl(var(--primary)); display: inline-flex; align-items: center; justify-content: center; font-weight: 500; }
  .nav .brand .ver { font-family: var(--font-mono); font-size: 11px; padding: 2px 8px; border: 1px solid hsl(var(--border)); border-radius: var(--r-full); margin-left: 6px; letter-spacing: .14em; text-transform: uppercase; color: hsl(var(--muted-foreground)); }
  .nav-links { display: inline-flex; align-items: center; gap: var(--s4); font-family: var(--font-inter); font-size: 14px; }
  .nav-links a { color: hsl(var(--foreground)); text-decoration: none; }
  .nav-links a:hover { color: hsl(var(--primary)); }
  .shell { max-width: 1320px; margin: 0 auto; padding: 0 var(--s5); }

  .theme-toggle { background: transparent; border: 1px solid hsl(var(--border)); color: hsl(var(--foreground)); width: 36px; height: 36px; border-radius: var(--r-full); display: inline-flex; align-items: center; justify-content: center; cursor: pointer; font-family: var(--font-mono); font-size: 14px; line-height: 1; padding: 0; }
  .theme-toggle:hover { border-color: hsl(var(--foreground)); background: hsl(var(--surface)); }
  .theme-toggle .sun { display: inline; }
  .theme-toggle .moon { display: none; }
  .dark .theme-toggle .sun { display: none; }
  .dark .theme-toggle .moon { display: inline; }

  /* ── Page layout ──────────────────────────────────────────────── */
  .docs-shell {
    max-width: 1320px;
    margin: 0 auto;
    padding: var(--s5) var(--s5) var(--s7);
    display: grid;
    grid-template-columns: 280px 1fr;
    gap: var(--s6);
    align-items: start;
  }

  .docs-header {
    grid-column: 1 / -1;
    padding: var(--s5) 0 var(--s4);
    border-bottom: 1px solid hsl(var(--border));
    margin-bottom: var(--s5);
  }
  .docs-header .breadcrumbs {
    font-family: var(--font-mono);
    font-size: 11px;
    letter-spacing: .14em;
    text-transform: uppercase;
    color: hsl(var(--muted-foreground));
    margin-bottom: var(--s2);
  }
  .docs-header .breadcrumbs a { color: hsl(var(--muted-foreground)); text-decoration: none; }
  .docs-header .breadcrumbs a:hover { color: hsl(var(--primary)); }
  .docs-header h1 {
    font-family: var(--font-sora);
    font-size: clamp(28px, 3.6vw, 44px);
    line-height: 1.1;
    letter-spacing: -.015em;
    font-weight: 400;
    margin: 0;
  }
  .docs-header h1 .ital { font-style: italic; color: hsl(var(--primary)); }
  .docs-header .sub {
    margin-top: var(--s2);
    font-family: var(--font-inter);
    font-size: 15px;
    color: hsl(var(--muted-foreground));
  }

  /* ── Sidebar (search + TOC) ───────────────────────────────────── */
  .sidebar {
    position: sticky;
    top: 88px;
    max-height: calc(100vh - 100px);
    display: flex;
    flex-direction: column;
    gap: var(--s3);
  }

  .search {
    position: relative;
  }
  .search input {
    width: 100%;
    box-sizing: border-box;
    font-family: var(--font-inter);
    font-size: 14px;
    line-height: 1;
    padding: 10px 12px 10px 34px;
    border: 1px solid hsl(var(--border));
    border-radius: var(--r-md);
    background: hsl(var(--background));
    color: hsl(var(--foreground));
    outline: none;
    transition: border-color var(--dur-fast) var(--ease-out);
  }
  .search input:focus {
    border-color: hsl(var(--primary));
  }
  .search .icon {
    position: absolute;
    left: 12px;
    top: 50%;
    transform: translateY(-50%);
    width: 14px; height: 14px;
    color: hsl(var(--muted-foreground));
    pointer-events: none;
  }
  .search .kbd {
    position: absolute;
    right: 8px;
    top: 50%;
    transform: translateY(-50%);
    font-family: var(--font-mono);
    font-size: 11px;
    padding: 2px 6px;
    border: 1px solid hsl(var(--border));
    border-radius: 4px;
    color: hsl(var(--muted-foreground));
    background: hsl(var(--surface));
    pointer-events: none;
  }

  .toc {
    flex: 1 1 auto;
    overflow-y: auto;
    font-family: var(--font-inter);
    font-size: 13px;
    line-height: 1.5;
    padding-right: var(--s3);
    border-right: 1px solid hsl(var(--border));
    min-height: 0;
  }
  .toc h4 {
    font-family: var(--font-mono);
    font-size: 11px;
    letter-spacing: .14em;
    text-transform: uppercase;
    color: hsl(var(--muted-foreground));
    margin: 0 0 var(--s3);
    font-weight: 500;
  }
  .toc ul { list-style: none; padding: 0; margin: 0; display: grid; gap: 1px; }
  .toc a {
    color: hsl(var(--foreground));
    text-decoration: none;
    display: block;
    padding: 4px 10px;
    border-radius: 4px;
    transition: background var(--dur-fast) var(--ease-out), color var(--dur-fast) var(--ease-out);
    border-left: 2px solid transparent;
  }
  .toc a:hover { background: hsl(var(--surface)); color: hsl(var(--primary)); }
  .toc a.active {
    background: hsl(var(--surface));
    color: hsl(var(--primary));
    border-left-color: hsl(var(--primary));
  }
  .toc li.hidden { display: none; }
  .toc .empty {
    color: hsl(var(--muted-foreground));
    font-style: italic;
    padding: var(--s4) var(--s2);
    font-size: 13px;
  }

  /* Command path inside grouped TOC — monospace, two-tone:
     muted prefix + foreground last segment so the eye lands on what's new. */
  .toc a .leaf {
    font-family: var(--font-mono);
    font-size: 12.5px;
  }
  .toc a .leaf .prefix { color: hsl(var(--muted-foreground)); }
  .toc a .leaf .name { color: inherit; }
  .toc a.depth-1 { padding-left: 16px; }
  .toc a.depth-2 { padding-left: 26px; }
  .toc a.depth-3 { padding-left: 36px; }
  .toc a.depth-4 { padding-left: 46px; }
  .toc a.overview { font-style: italic; color: hsl(var(--muted-foreground)); }

  /* Module groups — <details>/<summary> for native collapse. */
  .toc-group {
    border-radius: 4px;
    margin-bottom: 2px;
  }
  .toc-group > summary {
    list-style: none;
    cursor: pointer;
    display: flex;
    align-items: center;
    gap: 6px;
    padding: 6px 10px;
    font-family: var(--font-mono);
    font-size: 11px;
    letter-spacing: .12em;
    text-transform: uppercase;
    color: hsl(var(--foreground));
    font-weight: 500;
    border-radius: 4px;
    transition: background var(--dur-fast) var(--ease-out);
    user-select: none;
  }
  .toc-group > summary::-webkit-details-marker { display: none; }
  .toc-group > summary::before {
    content: "▸";
    font-size: 10px;
    color: hsl(var(--muted-foreground));
    transition: transform var(--dur-fast) var(--ease-out);
    width: 10px;
    display: inline-block;
  }
  .toc-group[open] > summary::before { transform: rotate(90deg); }
  .toc-group > summary:hover {
    background: hsl(var(--surface));
    color: hsl(var(--primary));
  }
  .toc-group.has-active > summary {
    color: hsl(var(--primary));
  }
  .toc-group .count {
    margin-left: auto;
    font-family: var(--font-mono);
    font-size: 10px;
    color: hsl(var(--muted-foreground));
    background: hsl(var(--surface));
    padding: 1px 6px;
    border-radius: var(--r-full);
  }
  .toc-group > ul { margin: 2px 0 8px; }
  .toc-group.hidden { display: none; }

  /* ── Main reader (markdown rendered) ─────────────────────────── */
  .reader {
    font-family: var(--font-inter);
    font-size: 15px;
    line-height: 1.65;
    color: hsl(var(--foreground));
    min-width: 0;
  }

  /* type scale matches index.html — display / heading / subhead / body */
  .reader h1 {
    font-family: var(--font-sora);
    font-size: clamp(28px, 3.2vw, 40px);
    font-weight: 400;
    letter-spacing: -.015em;
    line-height: 1.15;
    margin: var(--s6) 0 var(--s4);
  }
  .reader h1:first-child { margin-top: 0; }
  .reader h2 {
    font-family: var(--font-sora);
    font-size: clamp(22px, 2.4vw, 30px);
    font-weight: 400;
    letter-spacing: -.01em;
    line-height: 1.2;
    margin: var(--s6) 0 var(--s3);
    padding-bottom: var(--s2);
    border-bottom: 1px solid hsl(var(--border));
    position: relative;
  }
  .reader h3 {
    font-family: var(--font-sora);
    font-size: clamp(18px, 1.8vw, 22px);
    font-weight: 500;
    margin: var(--s5) 0 var(--s2);
    color: hsl(var(--foreground));
    position: relative;
  }
  .reader h4 {
    font-family: var(--font-inter);
    font-size: 13px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: .06em;
    margin: var(--s4) 0 var(--s2);
    color: hsl(var(--muted-foreground));
  }

  /* anchor on hover for h2/h3 */
  .reader h2 .anchor, .reader h3 .anchor {
    position: absolute;
    left: -22px;
    top: 50%;
    transform: translateY(-50%);
    opacity: 0;
    color: hsl(var(--muted-foreground));
    text-decoration: none;
    font-weight: 400;
    transition: opacity var(--dur-fast) var(--ease-out);
  }
  .reader h2:hover .anchor, .reader h3:hover .anchor { opacity: 1; }
  .reader h2 .anchor:hover, .reader h3 .anchor:hover { color: hsl(var(--primary)); }

  .reader p { margin: 0 0 var(--s3); }
  .reader a { color: hsl(var(--primary)); text-decoration: underline; text-underline-offset: 3px; }
  .reader a:hover { text-decoration-thickness: 2px; }
  .reader code {
    font-family: var(--font-mono);
    font-size: .9em;
    background: hsl(var(--code));
    color: hsl(var(--code-foreground));
    padding: 2px 6px;
    border-radius: 4px;
    border: 1px solid hsl(var(--border));
  }

  /* code blocks — terminal-like, with copy button + filename label */
  .reader .code-block {
    position: relative;
    margin: var(--s3) 0;
  }
  .reader pre {
    font-family: var(--font-mono);
    font-size: 13px;
    line-height: 1.55;
    background: #0A0B14;
    color: #E6E6E9;
    padding: var(--s4);
    padding-top: 36px;
    border-radius: var(--r-md);
    overflow-x: auto;
    border: 1px solid #1E2030;
    margin: 0;
  }
  .reader pre code {
    background: transparent;
    color: inherit;
    border: 0;
    padding: 0;
    font-size: 13px;
  }
  .reader .code-block::before {
    content: "$";
    position: absolute;
    top: 8px;
    left: 14px;
    font-family: var(--font-mono);
    font-size: 11px;
    color: #5b6bff;
    letter-spacing: .04em;
  }
  .reader .code-block .copy-btn {
    position: absolute;
    top: 6px;
    right: 8px;
    font-family: var(--font-mono);
    font-size: 11px;
    background: rgba(255,255,255,.04);
    color: rgba(230,230,233,.7);
    border: 1px solid rgba(255,255,255,.12);
    padding: 4px 10px;
    border-radius: 4px;
    cursor: pointer;
    letter-spacing: .08em;
    text-transform: uppercase;
    transition: all var(--dur-fast) var(--ease-out);
  }
  .reader .code-block .copy-btn:hover {
    border-color: #5b6bff;
    color: #FFFFFF;
  }
  .reader .code-block .copy-btn.copied {
    border-color: hsl(var(--success));
    color: hsl(var(--success));
  }

  .reader ul, .reader ol { margin: 0 0 var(--s3); padding-left: var(--s5); }
  .reader li { margin-bottom: 4px; }
  .reader blockquote {
    border-left: 3px solid hsl(var(--primary));
    margin: var(--s3) 0;
    padding: var(--s2) var(--s4);
    background: hsl(var(--surface));
    color: hsl(var(--muted-foreground));
    font-style: italic;
    border-radius: 0 var(--r-md) var(--r-md) 0;
  }
  .reader hr {
    border: 0;
    border-top: 1px solid hsl(var(--border));
    margin: var(--s5) 0;
  }
  .reader table {
    width: 100%;
    border-collapse: collapse;
    margin: var(--s3) 0;
    font-size: 14px;
    border: 1px solid hsl(var(--border));
    border-radius: var(--r-md);
    overflow: hidden;
  }
  .reader th, .reader td {
    text-align: left;
    padding: 10px 14px;
    border-bottom: 1px solid hsl(var(--border));
  }
  .reader th {
    background: hsl(var(--surface));
    font-weight: 600;
    font-family: var(--font-inter);
    font-size: 12px;
    letter-spacing: .04em;
    text-transform: uppercase;
    color: hsl(var(--muted-foreground));
  }
  .reader tbody tr:last-child td { border-bottom: 0; }
  .reader tbody tr:hover { background: hsl(var(--surface)); }

  /* anchor link offset for sticky nav */
  .reader h1, .reader h2, .reader h3 { scroll-margin-top: 88px; }

  /* loading + error states */
  .doc-state {
    padding: var(--s7) var(--s5);
    text-align: center;
    font-family: var(--font-mono);
    font-size: 13px;
    letter-spacing: .04em;
    color: hsl(var(--muted-foreground));
  }
  .doc-state .err { color: hsl(var(--destructive)); }
  .doc-state a { color: hsl(var(--primary)); text-decoration: underline; }

  /* floating back-to-top */
  .to-top {
    position: fixed;
    bottom: 24px;
    right: 24px;
    width: 40px;
    height: 40px;
    border-radius: var(--r-full);
    background: hsl(var(--foreground));
    color: hsl(var(--background));
    border: 0;
    display: none;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    box-shadow: 0 6px 20px hsl(var(--foreground) / .25);
    transition: transform var(--dur-fast) var(--ease-out);
    z-index: 30;
    font-size: 18px;
    line-height: 1;
  }
  .to-top.visible { display: inline-flex; }
  .to-top:hover { transform: translateY(-2px); }

  @media (max-width: 960px) {
    .docs-shell { grid-template-columns: 1fr; gap: var(--s4); }
    .sidebar { position: static; max-height: none; }
    .toc { border-right: 0; border-bottom: 1px solid hsl(var(--border)); padding-right: 0; padding-bottom: var(--s4); max-height: 320px; }
  }
</style>
</head>

<script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js" defer></script>

<script>
  // ── Theme toggle (parity with index.html) ─────────────────────────
  (function () {
    var root = document.documentElement;
    var saved = localStorage.getItem('plivo-cli-theme');
    var prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
    if (saved === 'dark' || (saved == null && prefersDark)) root.classList.add('dark');
    document.addEventListener('DOMContentLoaded', function () {
      var btn = document.getElementById('theme-toggle');
      if (!btn) return;
      btn.addEventListener('click', function () {
        var isDark = root.classList.toggle('dark');
        localStorage.setItem('plivo-cli-theme', isDark ? 'dark' : 'light');
      });
    });
  })();
</script>

<script>
  // ── Render COMMANDS.md + build TOC + wire up search ──────────────
  function slug(s) {
    return s.toLowerCase().trim()
      .replace(/[^\w\s\-/]/g, '')
      .replace(/[\s/]+/g, '-')
      .replace(/-+/g, '-');
  }

  function decorateHeadings(temp) {
    var items = [];
    temp.querySelectorAll('h1, h2, h3').forEach(function (h) {
      var id = slug(h.textContent);
      h.id = id;
      if (h.tagName === 'H2' || h.tagName === 'H3') {
        var anchor = document.createElement('a');
        anchor.href = '#' + id;
        anchor.className = 'anchor';
        anchor.setAttribute('aria-label', 'Anchor link');
        anchor.textContent = '#';
        h.prepend(anchor);
      }
      items.push({ level: h.tagName.toLowerCase(), text: h.textContent.replace(/^#/, '').trim(), id: id });
    });
    return items;
  }

  function wrapCodeBlocks(temp) {
    temp.querySelectorAll('pre').forEach(function (pre) {
      var wrap = document.createElement('div');
      wrap.className = 'code-block';
      pre.parentNode.insertBefore(wrap, pre);
      wrap.appendChild(pre);

      var btn = document.createElement('button');
      btn.className = 'copy-btn';
      btn.type = 'button';
      btn.textContent = 'Copy';
      btn.addEventListener('click', function () {
        var code = pre.querySelector('code') || pre;
        navigator.clipboard.writeText(code.textContent).then(function () {
          btn.textContent = 'Copied';
          btn.classList.add('copied');
          setTimeout(function () { btn.textContent = 'Copy'; btn.classList.remove('copied'); }, 1500);
        });
      });
      wrap.appendChild(btn);
    });
  }

  // Group TOC items by command module.
  //
  // The doc structure is "## `plivo <module> [subcommand…]`" for every
  // command. We strip the `plivo ` prefix, take segment [0] as the module
  // group, and keep the rest of the path as the visible item text.
  //
  // Non-command headings (the top-level "Commands" heading, the bare
  // "plivo" root) land in a special "Overview" group at the top.
  function groupItems(items) {
    var overview = { id: '__overview', name: 'Overview', items: [] };
    var groups = [overview];
    var byKey = { __overview: overview };

    items.forEach(function (i) {
      if (i.level === 'h1') return; // skip the doc title
      // strip backticks if marked rendered them inside the heading
      var raw = i.text.replace(/`/g, '').trim();
      // not a command heading → overview
      if (!/^plivo(\s|$)/.test(raw)) {
        overview.items.push({
          id: i.id, text: raw, depth: 0, fullPath: raw, isOverview: false
        });
        return;
      }
      var parts = raw.split(/\s+/); // ["plivo", "voice", "calls", "list"]
      if (parts.length === 1) {
        // bare "plivo" — root command
        overview.items.push({
          id: i.id, text: 'plivo (root)', depth: 0, fullPath: 'plivo', isOverview: false
        });
        return;
      }
      var moduleName = parts[1];
      var key = moduleName;
      if (!byKey[key]) {
        byKey[key] = { id: '__g_' + key, name: moduleName, items: [] };
        groups.push(byKey[key]);
      }
      var rest = parts.slice(2); // segments after the module name
      var isOverview = rest.length === 0;
      var leaf = isOverview ? 'overview' : rest[rest.length - 1];
      var prefix = isOverview ? '' : rest.slice(0, -1).join(' ');
      byKey[key].items.push({
        id: i.id,
        leaf: leaf,
        prefix: prefix,
        depth: rest.length,            // 0 = module overview, 1 = direct child, ...
        fullPath: parts.join(' '),     // for search matching
        isOverview: isOverview
      });
    });

    // drop the Overview group if empty so we don't render a blank header
    if (overview.items.length === 0) groups.shift();
    // sort each module's items by depth then alphabetically
    groups.forEach(function (g) {
      g.items.sort(function (a, b) {
        if (a.depth !== b.depth) return a.depth - b.depth;
        return a.fullPath.localeCompare(b.fullPath);
      });
    });
    return groups;
  }

  function renderTOC(items) {
    var list = document.getElementById('toc-list');
    list.innerHTML = '';
    var groups = groupItems(items);
    if (groups.length === 0) {
      list.innerHTML = '<li class="empty">No headings found.</li>';
      return;
    }
    groups.forEach(function (g, idx) {
      var li = document.createElement('li');
      var details = document.createElement('details');
      details.className = 'toc-group';
      details.dataset.module = g.name.toLowerCase();
      // open the first group by default; rest collapsed
      if (idx === 0) details.open = true;

      var summary = document.createElement('summary');
      summary.innerHTML =
        '<span class="label">' + g.name + '</span>' +
        '<span class="count">' + g.items.length + '</span>';
      details.appendChild(summary);

      var inner = document.createElement('ul');
      g.items.forEach(function (it) {
        var ili = document.createElement('li');
        ili.dataset.text = (it.fullPath || it.text || '').toLowerCase();
        var a = document.createElement('a');
        a.href = '#' + it.id;
        if (it.leaf !== undefined) {
          // command — render with mono prefix · name styling
          a.classList.add('depth-' + Math.min(it.depth, 4));
          if (it.isOverview) {
            a.classList.add('overview');
            a.innerHTML = '<span class="leaf"><span class="name">' + escapeHTML(g.name) + '</span> &nbsp;overview</span>';
          } else {
            a.innerHTML =
              '<span class="leaf">' +
                (it.prefix ? '<span class="prefix">' + escapeHTML(it.prefix) + ' </span>' : '') +
                '<span class="name">' + escapeHTML(it.leaf) + '</span>' +
              '</span>';
          }
        } else {
          a.textContent = it.text;
        }
        ili.appendChild(a);
        inner.appendChild(ili);
      });
      details.appendChild(inner);
      li.appendChild(details);
      list.appendChild(li);
    });
  }

  function escapeHTML(s) {
    return String(s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }

  function wireSearch() {
    var input = document.getElementById('search-input');
    var list = document.getElementById('toc-list');
    if (!input || !list) return;
    input.addEventListener('input', function () {
      var q = input.value.trim().toLowerCase();
      var groups = list.querySelectorAll('.toc-group');
      var anyShown = false;
      groups.forEach(function (g) {
        var items = g.querySelectorAll('li');
        var groupHasMatch = false;
        items.forEach(function (li) {
          var match = !q || (li.dataset.text || '').indexOf(q) > -1;
          li.classList.toggle('hidden', !match);
          if (match) groupHasMatch = true;
        });
        // also let the module name itself match
        if (q && g.dataset.module && g.dataset.module.indexOf(q) > -1) groupHasMatch = true;
        g.classList.toggle('hidden', !groupHasMatch);
        if (groupHasMatch && q) g.open = true;
        if (groupHasMatch) anyShown = true;
      });
      var existing = list.querySelector('.empty');
      if (!anyShown && !existing) {
        var li = document.createElement('li');
        li.className = 'empty';
        li.textContent = 'No matches for "' + input.value + '".';
        list.appendChild(li);
      } else if (anyShown && existing) {
        existing.remove();
      }
    });
    document.addEventListener('keydown', function (e) {
      if (e.key === '/' && document.activeElement.tagName !== 'INPUT' && document.activeElement.tagName !== 'TEXTAREA' && !e.metaKey && !e.ctrlKey && !e.altKey) {
        e.preventDefault();
        input.focus();
        input.select();
      }
      if (e.key === 'Escape' && document.activeElement === input) {
        input.value = '';
        input.dispatchEvent(new Event('input'));
        input.blur();
      }
    });
  }

  function wireActiveHighlight(items) {
    var links = Array.prototype.slice.call(document.querySelectorAll('#toc-list a'));
    var byId = {};
    links.forEach(function (a) { byId[a.getAttribute('href').slice(1)] = a; });
    var headings = items.map(function (i) { return document.getElementById(i.id); }).filter(Boolean);
    if (!('IntersectionObserver' in window)) return;
    var observer = new IntersectionObserver(function (entries) {
      entries.forEach(function (entry) {
        var link = byId[entry.target.id];
        if (!link) return;
        if (entry.isIntersecting) {
          // clear active state across all groups, then highlight current
          links.forEach(function (a) { a.classList.remove('active'); });
          document.querySelectorAll('.toc-group.has-active').forEach(function (g) { g.classList.remove('has-active'); });
          link.classList.add('active');
          // open + tag the parent group so it's visible in the sidebar
          var group = link.closest('.toc-group');
          if (group) {
            group.open = true;
            group.classList.add('has-active');
            // bring the active link into view inside the (scrollable) sidebar
            link.scrollIntoView({ block: 'nearest' });
          }
        }
      });
    }, { rootMargin: '-100px 0px -70% 0px' });
    headings.forEach(function (h) { observer.observe(h); });
  }

  function wireToTop() {
    var btn = document.getElementById('to-top');
    if (!btn) return;
    btn.addEventListener('click', function () { window.scrollTo({ top: 0, behavior: 'smooth' }); });
    window.addEventListener('scroll', function () {
      btn.classList.toggle('visible', window.scrollY > 400);
    }, { passive: true });
  }

  document.addEventListener('DOMContentLoaded', function () {
    wireToTop();
    fetch('COMMANDS.md')
      .then(function (r) {
        if (!r.ok) throw new Error('HTTP ' + r.status);
        return r.text();
      })
      .then(function (md) {
        function render() {
          if (typeof marked === 'undefined') { return setTimeout(render, 30); }
          marked.setOptions({ gfm: true, breaks: false });
          var temp = document.createElement('div');
          temp.innerHTML = marked.parse(md);
          var items = decorateHeadings(temp);
          wrapCodeBlocks(temp);
          var reader = document.getElementById('reader');
          reader.innerHTML = '';
          while (temp.firstChild) reader.appendChild(temp.firstChild);
          reader.setAttribute('aria-busy', 'false');
          renderTOC(items);
          wireSearch();
          wireActiveHighlight(items);
          // jump-to-hash after render
          if (location.hash) {
            var el = document.getElementById(location.hash.slice(1));
            if (el) el.scrollIntoView({ behavior: 'auto', block: 'start' });
          }
        }
        render();
      })
      .catch(function (err) {
        var reader = document.getElementById('reader');
        reader.innerHTML =
          '<div class="doc-state">' +
          '<div class="err">⚠ couldn\'t load the command reference (' + err.message + ')</div>' +
          '<p>You can still read it on <a href="https://github.com/plivo/plivo-cli/blob/main/docs/COMMANDS.md">GitHub</a>.</p>' +
          '</div>';
      });
  });
</script>

</body>
</html>
